site_name: StreetBasher Instructions
site_description: A comprehensive guide to mastering StreetBasher with clarity and ease.
site_author: Mustafa
repo_url: https://github.com/CagriCatik/StreetBasher
repo_name: StreetBasher

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: blue
      accent: orange
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: blue
      accent: red

plugins:
  - search
  - glightbox
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list

extra_javascript:
  - type: module
    path: javascripts/stl-viewer-module.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - Bill of Materials: bom.md
      - Cost Analysis: cost_analysis.md
      - Parts Inventory: parts.md
  - Technical Documentation:
      - Quick Start Guide: guide/01_technical_specification.md
      - Chassis Assembly: guide/02_chassis_main.md
  - 3D Component Previews:
      - Body Roll Cage: parts_previews/preview_body_roll_cage.md
      - Center Drive: parts_previews/preview_center_drive.md
      - Chassis: parts_previews/preview_chassis.md
      - Differential: parts_previews/preview_differential.md
      - Electronics: parts_previews/preview_electronics.md
      - Front Suspension: parts_previews/preview_front_suspension.md
      - Rear Suspension: parts_previews/preview_rear_suspension.md
      - Steering: parts_previews/preview_steering.md
      - Sway Bar: parts_previews/preview_sway_bar.md
      - Wing: parts_previews/preview_wing.md
      - Tools & Helpers: parts_previews/preview_test_and_help.md
  - Resources:
      - Downloads: resources.md
      - CAD Source Files: cad_files.md
